name: Build and publish a Docker image to ghcr.io
on:

  # publish on releases, e.g. v2.1.13 (image tagged as "2.1.13" - "v" prefix is removed)
  release:
    types: [ published ]

  # called by the release workflow after a new version is released
  workflow_call:
    inputs:
      version:
        description: "Release tag, e.g. v2.1.13"
        type: string
        required: false
        default: ""

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 11 for x64
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@ccb4328a959376b642e027874838f60f8e596de3
      - name: Run the Gradle buildFatJar task
        uses: gradle/gradle-build-action@749f47bda3e44aa060e82d7b3ef7e40d953bd629
        with:
          arguments: buildFatJar
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Compute image tags
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          TAGS="ghcr.io/${{ github.repository }}:latest"
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:$VERSION"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
