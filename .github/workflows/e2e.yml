name: e2e

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build fat jar
        run: ./gradlew buildFatJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pdf-filler:test

      - name: Start service
        run: docker run -d --name pdf-filler -p 8080:8080 pdf-filler:test

      - name: Wait for service
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/ > /dev/null && exit 0
            sleep 1
          done
          docker logs pdf-filler
          exit 1

      - name: Fill test form with curl
        run: |
          curl -fsS \
            -F pdf=@tests/e2e/form.pdf \
            -F form=@tests/e2e/form.xfdf \
            http://localhost:8080/fill -o filled.pdf

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Check filled PDF
        run: |
          test "$(head -c 5 filled.pdf)" = "%PDF-"
          pdftotext filled.pdf - | grep -q "Test module"
          pdftotext filled.pdf - | grep -q "John Smith"
          pdftotext filled.pdf - | grep -q "London"

      - name: Render filled PDF to image
        run: |
          pdftoppm -png -r 150 -singlefile filled.pdf filled-form

      - name: Upload image
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: filled-form
          path: filled-form.png

      - name: Comment on PR with image link
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_URL: ${{ steps.upload.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "e2e: the test form was filled through the Docker image. Rendered output: $IMAGE_URL"

      - name: Stop service
        if: always()
        run: docker rm -f pdf-filler || true
