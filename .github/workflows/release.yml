name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/github@12.0.10 \
            semantic-release
          # semantic-release tags the checked-out commit when it publishes a release
          echo "version=$(git tag --points-at HEAD --list 'v*')" >> "$GITHUB_OUTPUT"

  docker:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
